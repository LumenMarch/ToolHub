[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.140.0",
    "fastexcel>=0.20.2",
    "fpdf>=1.7.2",
    "loguru>=0.7.3",
    "numpy<2.2.0",
    "openpyxl<3.1.5",
    "passlib>=1.7.4",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf2>=3.0.1",
    "python-dateutil>=2.9.0",
    "python-multipart>=0.0.32",
    "reportlab>=4.0.0,<5.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "xlrd>=2.0.2",
    "xlsxwriter>=3.2.9",
    "rustpy-xlsxwriter>=0.1.0",
    "websockets>=17.0.1",
    "portalocker>=4.1.0",
    "tzdata>=2026.3",
    "brotli>=1.2.0",
    "qrcode[pil]>=8.2",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = ["B008", "E501", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
