services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toolhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toolhub}
      POSTGRES_DB: toolhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolhub -d toolhub"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.bootstrap
    environment: &backend-env
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg://toolhub:${POSTGRES_PASSWORD:-toolhub}@postgres:5432/toolhub
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
      TASK_ARTIFACT_ROOT: /data/toolhub-artifacts
      JOB_QUEUE_BACKEND: rq
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${API_WORKERS:-2}
    environment: *backend-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - artifacts:/data/toolhub-artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - artifacts:/data/toolhub-artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  artifacts:
